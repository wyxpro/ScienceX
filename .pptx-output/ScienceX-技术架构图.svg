<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ScienceX 技术架构</title>
  <desc id="desc">React SPA 浏览器端、Node.js Express 后端 API、数据层与 DeepSeek 或 OpenAI-compatible 模型网关的分层架构图。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#1467D8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#20B9E8"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif; fill: #10243A; }
      .title { font-size: 36px; font-weight: 700; letter-spacing: 0; }
      .subtitle { font-size: 17px; fill: #50657A; }
      .layer-title { font-size: 22px; font-weight: 700; }
      .layer-meta { font-size: 16px; fill: #50657A; }
      .card-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; fill: #50657A; }
      .body-dark { font-size: 15px; fill: #EAF4FF; }
      .body-dark-muted { font-size: 13px; fill: #B8D3EA; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 14px; fill: #1467D8; }
      .mono-dark { font-family: Consolas, "Courier New", monospace; font-size: 14px; fill: #8EE9FF; }
      .small { font-size: 13px; fill: #50657A; }
      .small-dark { font-size: 13px; fill: #D7E9F8; }
      .pill { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F5F9FD"/>
  <rect x="40" y="32" width="1840" height="1016" rx="20" fill="none" stroke="#D8E5F2" stroke-width="2"/>

  <text x="80" y="78" class="font title">ScienceX 技术架构</text>
  <text x="80" y="108" class="font subtitle">从 React SPA 到 Node.js API，再到可替换模型网关：一套工作台承载完整科研链路</text>
  <rect x="1580" y="60" width="260" height="34" rx="17" fill="#EAF4FF" stroke="#B9D8F6"/>
  <text x="1710" y="82" text-anchor="middle" class="font pill" fill="#1467D8">REST(JSON) + SSE</text>

  <!-- Browser / React SPA -->
  <rect x="60" y="135" width="1800" height="235" rx="16" fill="#FFFFFF" stroke="#D8E5F2" stroke-width="2"/>
  <rect x="60" y="135" width="12" height="235" rx="6" fill="#20B9E8"/>
  <text x="92" y="169" class="font layer-title">浏览器端 · React SPA</text>
  <text x="92" y="194" class="font layer-meta">根路径 = Landing 官网宣传页 · /login 登录 · 14 个科研工作台页面</text>

  <g>
    <rect x="92" y="215" width="300" height="112" rx="10" fill="#EAF4FF" stroke="#C7E0F8"/>
    <text x="112" y="243" class="font card-title">入口与账号</text>
    <text x="112" y="269" class="font body">Landing · 10 子组件</text>
    <text x="112" y="292" class="font body">/login · Account · 7 个分区</text>
    <rect x="112" y="300" width="78" height="20" rx="10" fill="#DDF6EE"/>
    <text x="151" y="314" text-anchor="middle" class="font pill" fill="#12836E">已实现</text>
  </g>
  <g>
    <rect x="420" y="215" width="300" height="112" rx="10" fill="#EAF4FF" stroke="#C7E0F8"/>
    <text x="440" y="243" class="font card-title">对话工作台</text>
    <text x="440" y="269" class="font body">Chat · 9 子组件</text>
    <text x="440" y="292" class="font body">ReAct · PlanFlow · CodeAct</text>
    <text x="440" y="314" class="font mono">流式 SSE</text>
  </g>
  <g>
    <rect x="748" y="215" width="300" height="112" rx="10" fill="#EAF4FF" stroke="#C7E0F8"/>
    <text x="768" y="243" class="font card-title">科研工作台</text>
    <text x="768" y="269" class="font body">Topic · Reader · Reproduce</text>
    <text x="768" y="292" class="font body">Experiment · 沉浸式阅读与复现</text>
    <text x="768" y="314" class="font mono">useIsMobile</text>
  </g>
  <g>
    <rect x="1076" y="215" width="300" height="112" rx="10" fill="#EAF4FF" stroke="#C7E0F8"/>
    <text x="1096" y="243" class="font card-title">分析与成果</text>
    <text x="1096" y="269" class="font body">Analysis · FigureStudio</text>
    <text x="1096" y="292" class="font body">Writing · Submission</text>
    <text x="1096" y="314" class="font body">图表、论文与投稿闭环</text>
  </g>
  <g>
    <rect x="1404" y="215" width="424" height="112" rx="10" fill="#EAF4FF" stroke="#C7E0F8"/>
    <text x="1424" y="243" class="font card-title">协作与移动端</text>
    <text x="1424" y="269" class="font body">Meeting · Review · Projects</text>
    <text x="1424" y="292" class="font body">≤768px 九类界面自适应</text>
    <rect x="1424" y="300" width="130" height="20" rx="10" fill="#DDF6EE"/>
    <text x="1489" y="314" text-anchor="middle" class="font pill" fill="#12836E">一套 API，多端</text>
  </g>

  <path d="M960 370 V408" stroke="#1467D8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="985" y="397" class="font small">Vite 代理自动跟随后端端口</text>

  <!-- Backend -->
  <rect x="60" y="415" width="1800" height="420" rx="16" fill="#FFFFFF" stroke="#D8E5F2" stroke-width="2"/>
  <rect x="60" y="415" width="12" height="420" rx="6" fill="#1467D8"/>
  <text x="92" y="449" class="font layer-title">后端 API 服务 · Node.js + Express</text>
  <text x="92" y="475" class="font layer-meta">:8787 · /api/v1 · 6 大域 · 40+ 接口</text>
  <rect x="1645" y="436" width="170" height="32" rx="16" fill="#EAF4FF" stroke="#B9D8F6"/>
  <text x="1730" y="457" text-anchor="middle" class="font pill" fill="#1467D8">分层 · 可追踪</text>

  <!-- middleware strip -->
  <rect x="92" y="495" width="1720" height="56" rx="10" fill="#EAF4FF" stroke="#C7E0F8"/>
  <text x="116" y="529" class="font card-title">中间件层</text>
  <text x="286" y="529" class="font body">CORS 白名单</text>
  <text x="516" y="529" class="font body">→ X-Request-Id 追踪</text>
  <text x="812" y="529" class="font body">→ JSON 解析（常规 2MB / 上传 72MB）</text>
  <text x="1288" y="529" class="font body">→ 分级限流</text>
  <rect x="1452" y="511" width="332" height="25" rx="12" fill="#FFFFFF" stroke="#B9D8F6"/>
  <text x="1618" y="528" text-anchor="middle" class="font small">对话 30/分 · 写作/文献 60/分</text>

  <!-- backend modules -->
  <rect x="92" y="575" width="550" height="220" rx="12" fill="#123A68"/>
  <text x="116" y="610" class="font card-title" fill="#FFFFFF">独立模块层</text>
  <text x="116" y="640" class="font mono-dark">src/ai/</text>
  <text x="216" y="640" class="font body-dark">config · client · textModality · streamAdapter</text>
  <text x="216" y="661" class="font body-dark-muted">/api/v1/ai/status · /test · DeepSeek / OpenAI-compatible</text>
  <text x="116" y="693" class="font mono-dark">security.js</text>
  <text x="254" y="693" class="font body-dark">scrypt · AES-256-GCM · HMAC 签名 Token</text>
  <text x="116" y="725" class="font mono-dark">lingxiEngine.js</text>
  <text x="282" y="725" class="font body-dark">8 类 Agent 编排 · 三层记忆 · MCP</text>
  <text x="116" y="757" class="font mono-dark">model-gateway.js</text>
  <text x="296" y="757" class="font body-dark">SSRF 防护 · 归属校验 · 用量计量</text>

  <rect x="675" y="575" width="470" height="220" rx="12" fill="#F7FBFF" stroke="#C7E0F8"/>
  <text x="701" y="610" class="font card-title">业务路由层</text>
  <text x="701" y="645" class="font title" font-size="32" fill="#1467D8">/api/v1</text>
  <text x="875" y="645" class="font card-title">40+ 接口</text>
  <text x="701" y="682" class="font body">account · chat · literature</text>
  <text x="701" y="708" class="font body">documents · research · publish</text>
  <rect x="701" y="740" width="192" height="28" rx="14" fill="#DDF6EE"/>
  <text x="797" y="759" text-anchor="middle" class="font pill" fill="#12836E">REST(JSON) + SSE</text>
  <text x="912" y="759" class="font small">统一响应 · 统一错误码</text>

  <rect x="1178" y="575" width="634" height="220" rx="12" fill="#F7FBFF" stroke="#C7E0F8"/>
  <text x="1204" y="610" class="font card-title">数据层</text>
  <text x="1204" y="646" class="font title" font-size="32" fill="#1467D8">30+ 集合</text>
  <text x="1204" y="682" class="font body">内存 Map + JSON 文件原子持久化</text>
  <text x="1204" y="710" class="font body">用户、项目、文献、实验、写作、计费、AI 等域</text>
  <rect x="1204" y="740" width="220" height="28" rx="14" fill="#FFF2D8"/>
  <text x="1314" y="759" text-anchor="middle" class="font pill" fill="#A86B00">当前单机数据层</text>
  <text x="1440" y="759" class="font small">重启可恢复 · 生产化可替换</text>

  <!-- Model providers -->
  <path d="M960 835 V858 H640 V885" fill="none" stroke="#20B9E8" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M960 835 V858 H1280 V885" fill="none" stroke="#20B9E8" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <text x="975" y="856" class="font small">模型网关统一路由 · 计量 · 归属校验</text>

  <rect x="60" y="875" width="1800" height="130" rx="16" fill="#EAF4FF" stroke="#B9D8F6" stroke-width="2"/>
  <text x="92" y="907" class="font layer-title">外部模型与服务</text>
  <rect x="330" y="895" width="580" height="82" rx="12" fill="#FFFFFF" stroke="#C7E0F8"/>
  <text x="360" y="924" class="font card-title">OpenAI-compatible 网关</text>
  <text x="360" y="950" class="font body">可配置 BaseURL / Key · 任意兼容模型</text>
  <rect x="760" y="908" width="110" height="24" rx="12" fill="#DDF6EE"/>
  <text x="815" y="925" text-anchor="middle" class="font pill" fill="#12836E">可选接入</text>

  <rect x="1010" y="895" width="580" height="82" rx="12" fill="#FFFFFF" stroke="#C7E0F8"/>
  <text x="1040" y="924" class="font card-title">DeepSeek V4.1 Flash</text>
  <text x="1040" y="950" class="font body">已对接 · 也可切换其他兼容大模型</text>
  <rect x="1438" y="908" width="112" height="24" rx="12" fill="#DDF6EE"/>
  <text x="1494" y="925" text-anchor="middle" class="font pill" fill="#12836E">已对接</text>

  <text x="80" y="1033" class="font small">ScienceX · AI 科研工作台</text>
  <text x="1840" y="1033" text-anchor="end" class="font small">当前实现：模型未配置时使用模板回退 · 生产化组件可按域替换</text>
</svg>
